<!DOCTYPE html>
<html lang="en">
<head>
<!-- PAGE: Login -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | EventHub UiTM</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="js/theme.js"></script>
</head>
<body>
<button class="btn btn-outline-secondary btn-icon position-absolute top-0 end-0 m-3" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Dark / light mode"><i class="bi bi-moon-stars t-light"></i><i class="bi bi-sun t-dark"></i></button>
<main class="reg-wrap">
  <div class="text-center mb-3"><img src="assets/icons/favicon.svg" width="48" height="48" alt=""><h1 class="h3 mt-2 mb-1">Create your account</h1><div class="text-body-secondary">Step <span id="rstep">1</span> of 3. Use the arrows to move between cards.</div></div>
  <div class="alert alert-danger d-none" id="err" role="alert" style="max-width:410px;width:100%"></div>
  <!-- Slideshow of 3 cards. The active card tilts when the cursor moves over it. -->
  <div class="rstage">
    <button type="button" class="r-arrow prev" id="rprev" onclick="go(-1)" aria-label="Previous step"><i class="bi bi-chevron-left"></i></button>
    <form id="rf" class="rtrack" novalidate>
      <div class="rcard"><div class="tilt">
        <div class="ico mb-3"><i class="bi bi-person"></i></div><h2 class="h5">About you</h2><p class="small text-body-secondary mb-4">Tell us who you are.</p>
        <div class="mb-3"><label class="form-label fw-bold small" for="name">Full name</label><input id="name" class="form-control" required></div>
        <div class="mb-4"><label class="form-label fw-bold small" for="user">Username</label><input id="user" class="form-control" autocomplete="username" minlength="3" required></div>
        <button type="button" class="btn btn-primary w-100" onclick="go(1)">Next <i class="bi bi-arrow-right ms-1"></i></button>
      </div></div>
      <div class="rcard"><div class="tilt">
        <div class="ico mb-3"><i class="bi bi-telephone"></i></div><h2 class="h5">Contact</h2><p class="small text-body-secondary mb-4">How can we reach you?</p>
        <div class="mb-3"><label class="form-label fw-bold small" for="email">Email</label><input id="email" type="email" class="form-control" required></div>
        <div class="mb-4"><label class="form-label fw-bold small" for="phone">Phone number</label><input id="phone" type="tel" class="form-control" pattern="[0-9 +\-]{9,15}" placeholder="012-3456789" required></div>
        <button type="button" class="btn btn-primary w-100" onclick="go(1)">Next <i class="bi bi-arrow-right ms-1"></i></button>
      </div></div>
      <div class="rcard"><div class="tilt">
        <div class="ico mb-3"><i class="bi bi-shield-lock"></i></div><h2 class="h5">Password</h2><p class="small text-body-secondary mb-4">Keep your account safe.</p>
        <div class="mb-3"><label class="form-label fw-bold small" for="pass">Password</label><input id="pass" type="password" class="form-control" minlength="6" autocomplete="new-password" required></div>
        <div class="mb-4"><label class="form-label fw-bold small" for="pass2">Confirm password</label><input id="pass2" type="password" class="form-control" autocomplete="new-password" required></div>
        <button class="btn btn-primary w-100">Create account</button>
      </div></div>
    </form>
    <button type="button" class="r-arrow next" id="rnext" onclick="go(1)" aria-label="Next step"><i class="bi bi-chevron-right"></i></button>
  </div>
  <div class="rdots" id="rdots"></div>
  <p class="text-center small mt-3 mb-0">Already have an account? <a href="index.html">Sign in</a></p>
</main>
<script src="js/data.js"></script><script src="js/register.js"></script>
</body>
</html>
