<!DOCTYPE html>
<html lang="en">
<head>
<!-- PAGE: Participants (admin) / My registrations (customer) -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Participants | EventHub UiTM</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="js/theme.js"></script>
</head>
<body data-page="participants">
<!-- SIDEBAR (built by js/app.js) -->
<div id="nav"></div>
<!-- MAIN CONTENT -->
<main class="container py-4">
<div class="sbar d-flex flex-wrap align-items-center gap-2 mb-4">
  <select id="by" class="form-select" data-all="Search ID, name, event, date or status" onchange="byChange()"><option value="all">All fields</option><option value="id">ID</option><option value="name">Name</option><option value="event">Event</option><option value="date">Date</option><option value="status">Status</option></select>
  <div class="position-relative flex-grow-1" style="min-width:200px"><i class="bi bi-search search-ico"></i><input id="q" type="text" class="form-control ps-5" placeholder="Search ID, name, event, date or status" oninput="render()"></div>
  <button class="btn btn-primary admin-only" onclick="crd.add()"><i class="bi bi-plus-lg me-1"></i> Add participant</button>
</div>
<div class="sec-head"><span class="sh-no"></span><span class="sh-ico"><i class="bi bi-people"></i></span><div class="sh-text"><h2 id="ttl">Registrations</h2><p><span id="pnote">All registrations</span></p></div><span class="sh-count" id="pcount">0</span><span class="sh-line"></span></div>
<div class="card overflow-hidden"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr id="thead"></tr></thead><tbody id="rows"></tbody></table></div></div>
</main>
<!-- FOOTER (built by js/app.js) -->
<div id="foot"></div>
<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/crud.js"></script><script src="js/participants.js"></script>
</body>
</html>
