<!DOCTYPE html>
<html lang="en">
<head>
<!-- PAGE: Dashboard -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | EventHub UiTM</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="js/theme.js"></script>
</head>
<body data-page="dashboard">
<!-- SIDEBAR (built by js/app.js) -->
<div id="nav"></div>
<!-- MAIN CONTENT -->
<main class="container py-4">
<!-- One heading for the page -->
<div class="sec-head"><span class="sh-no"></span><span class="sh-ico"><i class="bi bi-stars"></i></span><div class="sh-text"><h2 id="hello"></h2><p id="sub"></p></div><span class="sh-line"></span></div>

<!-- Apple-style summary slides: arrows, dots, swipe, or arrow keys. It also moves by itself. -->
<section class="stage" id="stage" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Summary slides">
  <div id="slides"></div>
  <button class="st-arrow prev" onclick="show(idx - 1)" aria-label="Previous slide"><i class="bi bi-chevron-left"></i></button>
  <button class="st-arrow next" onclick="show(idx + 1)" aria-label="Next slide"><i class="bi bi-chevron-right"></i></button>
  <div class="pager" id="pager"><div class="dots" id="pdots"></div><button class="pp" id="pp" onclick="togglePlay()" aria-label="Pause slideshow"><i class="bi bi-pause-fill"></i></button></div>
</section>

<!-- Two charts, same width and same height -->
<div class="row g-3 mt-4">
  <div class="col-lg-6 d-flex flex-column"><div class="sec-head"><span class="sh-no"></span><span class="sh-ico"><i class="bi bi-bullseye"></i></span><div class="sh-text"><h2>Event health scores</h2><p>How full and active your events are</p></div><span class="sh-line"></span></div><div class="card flex-grow-1"><div class="card-body p-4 d-flex flex-column"><div id="rgrid"></div><div class="rleg" id="rleg"></div></div></div></div>
  <div class="col-lg-6 d-flex flex-column"><div class="sec-head"><span class="sh-no"></span><span class="sh-ico"><i class="bi bi-graph-up-arrow"></i></span><div class="sh-text"><h2>Registrations by category</h2><p>Sign-ups per month, stacked</p></div><span class="sh-line"></span></div><div class="card flex-grow-1"><div class="card-body p-4 d-flex flex-column"><div class="chart-box"><canvas id="c1"></canvas></div></div></div></div>
</div>

<div class="sec-head"><span class="sh-no"></span><span class="sh-ico"><i class="bi bi-calendar-event"></i></span><div class="sh-text"><h2>Upcoming events</h2><p>The next events on the calendar</p></div><span class="sh-line"></span></div>
<div class="card"><div class="card-body p-4"><div id="up"></div></div></div>
</main>
<!-- FOOTER (built by js/app.js) -->
<div id="foot"></div>
<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script><script src="js/dashboard.js"></script>
</body>
</html>
